# app.conf — 部署模板的全部"项目相关参数"。
# 迁移到别的项目时,通常只需要改这个文件(加上构建/迁移命令两行)。
# 被所有 deploy/ 脚本 source;root 拥有,0644。

# ---- 身份与目录 ----
APP_NAME="demo-app"
APP_USER="app"                      # service 用户:跑服务、读 runtime.env
DEPLOY_USER="deploy"                # deploy 用户:构建 release(无密码、只能强制命令登录)
BIN_DIR="/opt/demo-app/bin"         # root 拥有的部署脚本
ENV_FILE="/opt/demo-app/env/runtime.env"
SRV_ROOT="/srv/demo-app"            # releases/ current storage/
REPO_CACHE="/srv/demo-app/repo.git" # bare 镜像,deploy 用户持有(只读 deploy key)
COMPOSE_DIR="/opt/demo-app/compose" # docker-compose.yml + .env(Postgres)

# ---- 工具链 ----
NODE_MAJOR="24"                     # 与仓库里 .node-version 的主版本一致

# ---- 服务 ----
UNITS="demo-app-web demo-app-worker"
VERSION_URL="http://127.0.0.1:3000/version"
READY_URL="http://127.0.0.1:3000/health/ready"
WORKER_MAX_HEARTBEAT_AGE="15"       # 秒;心跳比这旧 = worker 不健康
HEALTH_WAIT_SECONDS="60"            # 切换后等健康的最长时间
SOAK_SECONDS="30"                   # 健康后的观察窗口,抓崩溃循环

# ---- 发布与保留 ----
KEEP_RELEASES="5"                   # releases/ 保留个数(永不删 current 与上一版)
LOCK_FILE="/run/demo-app/deploy.lock"
FREEZE_FILE="/opt/demo-app/freeze"  # 紧急开关:存在即拒绝部署
LOG_DIR="/var/log/demo-app"
AUDIT_LOG="/var/log/demo-app/audit.log"

# ---- 备份(DB + 文件存储,按时间+按次数组合保留)----
BACKUP_DIR="/var/backups/demo-app"
BACKUP_KEEP_DAILY="14"
BACKUP_KEEP_PREMIGRATE="10"
STORAGE_DIR="/srv/demo-app/storage"

# ---- 数据库 ----
DB_CONTAINER="demo-app-db"
DB_NAME="demo_app"
DB_USER="demo_app"

# ---- 项目适配命令(迁移到其他项目最常改的两行)----
BUILD_CMD="pnpm install --frozen-lockfile && pnpm run build"
MIGRATE_CMD="node dist/migrate.js"
CHECK_CONFIG_CMD="node dist/config.js --check-config"
